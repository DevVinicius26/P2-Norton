<div class="container my-5" style="max-width: 450px;">
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <h3 class="text-center mb-4 text-danger fw-bold">Entrar na Doce Pedaço</h3>

        @if (mensagemErro()) {
            <div class="alert alert-danger small py-2">{{ mensagemErro() }}</div>
        }

        @if (mensagemSucesso()) {
            <div class="alert alert-success small py-2">{{ mensagemSucesso() }}</div>
        }

        <form (ngSubmit)="entrar($event)">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary small">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="O seu e-mail"
                    [ngModel]="email()"
                    (ngModelChange)="email.set($event)"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label text-secondary small">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    class="form-control"
                    placeholder="A sua senha"
                    [ngModel]="senha()"
                    (ngModelChange)="senha.set($event)"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-danger w-100 rounded-pill py-2 mb-3"
                [disabled]="carregando()"
            >
                {{ carregando() ? 'Entrando...' : 'Entrar' }}
            </button>

            <div class="d-flex justify-content-between text-center small">
                <a routerLink="/esqueci" class="text-decoration-none text-muted">Esqueci minha senha</a>
                <a routerLink="/cadastro" class="text-decoration-none text-danger fw-bold">Cadastre-se</a>
            </div>
        </form>
    </div>
</div>
